services:
  # Note: on the Cloudflare Zero Trust dashboard, financeforecast.exploretheworld.tech's
  # Public Hostname service is http://owl_dashboard_streamlit:8501 (the UI,
  # not this backend -- the backend is internal-only, reached by Streamlit's
  # server-side code over this same traefik_proxy network, never by a
  # browser). Streamlit also verifies the Authelia session itself
  # (streamlit_app/auth.py) rather than relying solely on the Cloudflare
  # Access policy being correctly configured -- that policy was found
  # misconfigured once already (silently serving the app unauthenticated).
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: owl_dashboard_backend
    ports:
      - "8010:8000"  # local dev convenience only; not needed once behind the tunnel
    volumes:
      - ../oauth:/app/oauth
      - ../data:/app/data
    environment:
      - DB_PATH=/app/data/owl_dashboard.db
      - OAUTH_DIR=/app/oauth
    networks:
      - traefik_proxy
    restart: unless-stopped

  # Prototype UI (step 7) -- the actual public-facing app right now (see the
  # note above). Reaches the backend by container name on traefik_proxy.
  streamlit:
    build:
      context: ..
      dockerfile: docker/streamlit.Dockerfile
    container_name: owl_dashboard_streamlit
    ports:
      - "8011:8501"  # local dev convenience only
    environment:
      - BACKEND_URL=http://owl_dashboard_backend:8000
      - AUTHELIA_URL=https://auth.exploretheworld.tech
      - PUBLIC_URL=https://financeforecast.exploretheworld.tech
      - REQUIRE_AUTH=true
    networks:
      - traefik_proxy
    restart: unless-stopped
    depends_on:
      - backend

networks:
  default:
    driver: bridge
  traefik_proxy:
    external: true
